name: AutoCut Studio CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  panel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm audit --omit=optional
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:host
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::pedantic -A clippy::nursery

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run color-core tests
        shell: pwsh
        run: |
          cmake -S native/color-core -B native/color-core/build
          cmake --build native/color-core/build --config Release
          ctest --test-dir native/color-core/build -C Release --output-on-failure
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild native/premiere-plugin/Win/AutoCutColorEngine.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TreatWarningsAsErrors=true /p:AE_PLUGIN_BUILD_DIR="$PWD\native\MediaCore"

  package:
    needs: [panel, rust, native]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - shell: pwsh
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: .\scripts\build-setup-exe.ps1
      - name: Build production-signed setup
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\scripts\build-setup-exe.ps1 -ProductionSigned
      - shell: pwsh
        run: Compress-Archive -Path .\dist\com.autocutstudio.panel -DestinationPath .\AutoCutStudio-CEP-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-Windows
          path: |
            AutoCutStudioSetup.exe
            AutoCutStudio-CEP-Windows.zip
      - name: Point the rolling release tag at this build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git tag --force latest-build $env:GITHUB_SHA
          git push origin refs/tags/latest-build --force
      - name: Publish rolling development release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: AutoCut Studio Latest Build
          prerelease: true
          make_latest: false
          body: |
            Automated unsigned Windows build from commit `${{ github.sha }}`.

            This rolling prerelease is replaced after every successful branch push.
          files: |
            AutoCutStudioSetup.exe
            AutoCutStudio-CEP-Windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            AutoCutStudioSetup.exe
            AutoCutStudio-CEP-Windows.zip

  upgrade-test:
    runs-on: windows-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run installer transaction tests
        run: cargo test -p autocut_studio_setup
