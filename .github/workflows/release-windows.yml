name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            analyzer
            installer

      - name: Test analyzer
        shell: pwsh
        working-directory: analyzer
        run: cargo test

      - name: Lint analyzer
        shell: pwsh
        working-directory: analyzer
        run: cargo clippy --all-targets -- -D warnings

      - name: Build setup executable
        shell: pwsh
        run: .\scripts\build-setup-exe.ps1

      - name: Test installer
        shell: pwsh
        working-directory: installer
        run: cargo test

      - name: Lint installer
        shell: pwsh
        working-directory: installer
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $required = @(
            ".\AutoCutStudioSetup.exe",
            ".\dist\com.autocutstudio.panel\CSXS\manifest.xml",
            ".\dist\com.autocutstudio.panel\index.html",
            ".\dist\com.autocutstudio.panel\js\main.js",
            ".\dist\com.autocutstudio.panel\jsx\host.jsx",
            ".\dist\com.autocutstudio.panel\bin\beat_analyzer.exe"
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing packaged file: $path"
            }
          }

      - name: Create extension zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\dist\com.autocutstudio.panel `
            -DestinationPath .\AutoCutStudio-CEP-Windows.zip `
            -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-Windows
          path: |
            AutoCutStudioSetup.exe
            AutoCutStudio-CEP-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Auto-Release Build ${{ github.run_number }}"
          files: |
            AutoCutStudioSetup.exe
            AutoCutStudio-CEP-Windows.zip
          generate_release_notes: true
