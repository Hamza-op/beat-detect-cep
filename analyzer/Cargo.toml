[package]
name = "beat_analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", features = [
  "aac",
  "all-codecs",
  "all-formats",
  "isomp4",
  "mkv",
  "mp3",
  "pcm",
  "wav"
] }
