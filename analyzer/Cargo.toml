[package]
name = "beat_analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", features = [
  "all-codecs",
  "all-formats"
] }
rayon = "1.10"

# ── Release: maximum throughput ───────────────────────────────
[profile.release]
opt-level = 3          # full LLVM optimisation
lto = "thin"           # cross-crate inlining without full LTO compile-time cost
codegen-units = 1      # single unit so LLVM sees the whole program
panic = "abort"        # no unwinding machinery in hot paths
strip = "debuginfo"    # smaller binary shipped to Premiere

[profile.dev]
opt-level = 1          # fast enough for iterative test runs
